<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساخت حساب کاربری | ترنج</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="products.html" class="brand">ترنج</a>
            <nav class="main-nav" aria-label="منوی اصلی">
                <a href="products.html">خانه</a>
                <a href="products.html">فروشگاه</a>
                <a href="products.html">دسته بندی ها</a>
                <a href="products.html">درباره ما</a>
            </nav>

            <div class="header-left">
                <a href="product.html" class="cart-link">سبد خرید</a>
                <a href="register.html" class="login-link">ورود</a>
            </div>
        </div>
    </header>

    <main class="register-main">
        <section class="register-card">
            <h1>ساخت حساب کاربری</h1>
            <p class="register-subtitle">بری خرید سریع تر حساب ترنج بسازید.</p>

            <form action="register.html" method="get" class="register-form">

                <div class="form-field">
                    <label for="email">ایمیل</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email"
                        required>
                </div>

                <div class="form-field">
                    <label for="phone">شماره همراه</label>
                    <input type="tel" id="phone" name="phone" pattern="00[0-9]{9}"
                        title="شماره همراه باید با 09 شروع شود و 11 رقم واشته باشد." autocomplete="tel" required>

                </div>

                <div class="form-field">
                    <label for="password">رمز عبور</label>
                    <input type="password" id="password" name="password" minlength="8" max="64"
                        autocomplete="new-password" required>
                </div>

                <div class="form-field">
                    <label for="confrim-password">تکرار رمز عبور</label>
                    <input type="password" name="confrim-password" id="confrim-password" minlength="8" maxlength="64">
                </div>

                <div class="form-actions">
                    <button class="button-primary" type="re  set">
                        پاک کردن
                    </button>

                    <button class="button-outline" type="submit">
                        ثبت نام
                    </button>
                </div>
            </form>
        </section>
    </main>

        <footer class="site-footer" id="footer">
        <div class="container" footer-inner>
            <p>ترنج؛ خرید ساده و مطمئن</p>
            <nav>
                <a href="products.html">پشتیبانی</a>
                <a href="products.html">قوانین و شرایط</a>
                <a href="products.html">اینستاگرام</a>
            </nav>
            <p>© ۱۴۰۵</p>
        </div>
    </footer>

</body>

</html>
